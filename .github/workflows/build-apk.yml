name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger otomatis rilis saat Anda push tag seperti v1.0.0
  workflow_dispatch: # Memungkinkan Anda untuk menjalankan workflow ini secara manual

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init SannMusic com.sannmusic.app --web-dir public
          
      - name: Configure Capacitor as WebView
        run: |
          echo '{
            "appId": "com.sannmusic.app",
            "appName": "SannMusic",
            "webDir": "public",
            "server": {
              "url": "https://web-music-new-update.vercel.app/",
              "cleartext": true
            }
          }' > capacitor.config.json

      - name: Build Android App
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SannMusic.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
