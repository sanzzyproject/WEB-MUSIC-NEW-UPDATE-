name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Memicu rilis otomatis jika Anda push tag seperti v1.0.0
  workflow_dispatch: # Memungkinkan Anda memicu build apk secara manual

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create WebView Project
        run: |
          mkdir webview-app
          cd webview-app
          
          # Inisialisasi package.json kosong khusus untuk Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          
          # Buat folder web dummy
          mkdir -p www
          echo "<html><head><meta http-equiv=\"refresh\" content=\"0; URL=https://web-music-new-update.vercel.app/\" /></head><body>Loading...</body></html>" > www/index.html
          
          # Inisialisasi Capacitor
          npx cap init SannMusic com.sannmusic.app --web-dir www
          
          # Konfigurasi WebView untuk mengarah ke URL Vercel langsung
          echo '{
            "appId": "com.sannmusic.app",
            "appName": "SannMusic",
            "webDir": "www",
            "server": {
              "url": "https://web-music-new-update.vercel.app/",
              "cleartext": true
            }
          }' > capacitor.config.json
          
          # Build Android
          npx cap add android
          npx cap sync android
          
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SannMusic.apk
          path: webview-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: webview-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
